services:
  api:
    build:
      context: .
    image: cocos-challenge:local
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
    ports:
      - "${HOST_PORT:-8080}:8080"

  db:
    image: postgres:17.6-alpine
    profiles:
      - local-db
    environment:
      POSTGRES_DB: cocos
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U cocos -d cocos"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./src/test/resources/data/database.sql:/docker-entrypoint-initdb.d/1-database.sql:ro
      - ./src/test/resources/data/indexes.sql:/docker-entrypoint-initdb.d/2-indexes.sql:ro
