services:
  api:
    build:
      context: .
    image: cocos-challenge:local
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
    ports:
      - "${HOST_PORT:-8080}:8080"

  db:
    image: postgres:17.6-alpine
    profiles:
      - local-db
    environment:
      POSTGRES_DB: cocos
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
    ports:
      - "5432:5432"
    volumes:
      - ./src/test/resources/data/database.sql:/docker-entrypoint-initdb.d/1-database.sql:ro
      - ./src/test/resources/data/indexes.sql:/docker-entrypoint-initdb.d/2-indexes.sql:ro
