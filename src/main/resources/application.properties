spring.application.name=cocos-challenge

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.jpa.properties.jakarta.persistence.lock.timeout=5000

spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=250

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

spring.data.web.pageable.serialization-mode=via-dto

cocos.orders.time-zone=America/Argentina/Buenos_Aires

spring.jackson.deserialization.accept-float-as-int=false
