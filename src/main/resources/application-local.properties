spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/cocos}
spring.datasource.username=${DB_USERNAME:cocos}
spring.datasource.password=${DB_PASSWORD:cocos}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.paths-to-match=/api/v1/**
springdoc.override-with-generic-response=false
logging.level.org.cocos=DEBUG
